name = "mdsstream-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Keep logs (viewable in the Cloudflare dashboard → Workers → mdsstream-api → Logs).
[observability]
enabled = true

# Check for new sets and notify subscribers.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mdsstream"
database_id = "8f420eaa-9055-4e10-83b3-6f07d0f5b39e"

# The audio files (and covers/notes). Upload by drag-and-drop in the Cloudflare dashboard.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "mdsstream-audio"

[vars]
GITHUB_REPO = "Pablo-Arias/mdsstream"
SITE_ORIGIN = "https://pablo-arias.github.io"
SETS_URL = "https://pablo-arias.github.io/mdsstream/sets.json"
VAPID_SUBJECT = "https://pablo-arias.github.io/mdsstream/"
VAPID_PUBLIC_KEY = "BJjiDXMj4aCHPZsf1L5qgLw23krlo9RmLaRr-thDlVZpsKDZjkdpenQsROZz5xdY8Zc7-30yv2uqvScbdbvP2Rg"
# Secrets (set with `wrangler secret put NAME`, never committed):
#   VAPID_PRIVATE_JWK  push signing key
#   GITHUB_TOKEN       fine-grained token, Actions read/write on the repo (expires 2026-12-29)
